[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-qa-engineering-suite"
version = "0.1.0"
description = "Reusable quality-engineering foundations for AI-built software."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI QA Engineering Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "playwright>=1.50,<2.0",
    "pydantic>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pytest>=8.0,<10.0",
    "pytest-playwright>=0.7,<1.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.11,<1.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
ai-qa = "ai_qa_engineering.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=ai_qa_engineering",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "unit: fast tests for individual components",
    "integration: tests that cross component boundaries",
    "e2e: browser or API journeys against a running application",
    "full: complete project coverage for the primary browser profile",
    "smoke: critical happy-path coverage for every browser profile",
    "detection_demo: intentionally faulty personas used only to demonstrate detection",
]

[tool.coverage.run]
branch = true
source = ["ai_qa_engineering"]
omit = ["src/ai_qa_engineering/pytest_plugin.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ai_qa_engineering"]
