name: Manual customer audit

on:
  workflow_dispatch:
    inputs:
      config:
        description: Repository-relative project configuration
        required: true
        default: configs/qapractice.yaml
        type: string
      profile:
        description: Optional single browser profile; leave blank for the full matrix
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CONFIG_PATH: ${{ inputs.config }}
      PROFILE_NAME: ${{ inputs.profile }}
      AI_QA_USERNAME: ${{ secrets.AI_QA_USERNAME }}
      AI_QA_PASSWORD: ${{ secrets.AI_QA_PASSWORD }}
      AUTH_SANDBOX_MEMBER_USERNAME: member@example.test
      AUTH_SANDBOX_MEMBER_PASSWORD: member-pass
      AUTH_SANDBOX_ADMIN_USERNAME: admin@example.test
      AUTH_SANDBOX_ADMIN_PASSWORD: admin-pass
      AUTH_SANDBOX_LOCKED_USERNAME: locked@example.test
      AUTH_SANDBOX_LOCKED_PASSWORD: locked-pass
      WORKFLOW_SANDBOX_API_TOKEN: workflow-sandbox-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install browsers
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Run complete audit
        run: |
          if [ -n "$PROFILE_NAME" ]; then
            ai-qa audit "$CONFIG_PATH" --profile "$PROFILE_NAME"
          else
            ai-qa audit "$CONFIG_PATH"
          fi

      - name: Preserve audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-qa-audit-${{ github.run_id }}
          path: artifacts/audits/
          if-no-files-found: error
          retention-days: 14
